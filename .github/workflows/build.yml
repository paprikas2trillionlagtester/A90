name: Build APK

on:
  push:
    branches: [ main, master, "claude/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # NOTE: we deliberately do NOT use actions/setup-python here.
      # Its Python builds currently ship a broken bundled pip, which makes
      # python-for-android's internal venv fail with
      #   ImportError: cannot import name 'open_rich_spinner'
      # The distro's own python3 (via apt) has a clean, consistent pip.
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3 python3-pip python3-venv python3-dev python3-setuptools \
            libffi-dev libssl-dev \
            autoconf libtool pkg-config \
            build-essential ccache

      - name: Install buildozer + cython
        run: |
          python3 -m pip install --user --upgrade buildozer cython
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build debug APK
        env:
          # python-for-android's internal build venv runs `pip install -U pip`,
          # which pulls the just-released pip 25.3. pip 25.3's in-place
          # self-upgrade corrupts its own install (mixed 25.2/25.3 modules ->
          # ImportError: cannot import name 'BuildDependencyInstallError' /
          # 'open_rich_spinner'). Constrain pip so that upgrade is a no-op and
          # the venv keeps its consistent, ensurepip-seeded pip.
          PIP_CONSTRAINT: ${{ github.workspace }}/ci-pip-constraint.txt
        run: |
          echo "pip<25.3" > "$GITHUB_WORKSPACE/ci-pip-constraint.txt"
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: a90-apk
          path: bin/*.apk
